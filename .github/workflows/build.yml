name: Build
on:
  push:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore/**'
      - 'tests/**'
      - 'scripts/**'
      - 'global.json'
      - '*.sln'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'Plain Craft Launcher 2/**'
      - 'PCLCS/**'
      - 'MeloongCore/**'
      - 'tests/**'
      - 'scripts/**'
      - 'global.json'
      - '*.sln'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: windows-latest
    strategy:  
       matrix:  
         configuration: [Debug, Release]

    steps:

    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 1
        submodules: true

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '8.0.x'

    - name: Set Describe
      shell: bash
      run: |
          describe=`git describe --tags --always`
          echo "describe=$describe" >> $GITHUB_ENV

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64
    
    - name: Update Help
      run:  |
        Set-Location ..
        git clone https://github.com/LTCatt/PCL2Help.git -b master --single-branch --depth 1
        Set-Location PCL2Help
        Remove-Item -Path *.* -Recurse -Force
        Compress-Archive -Path .\* -DestinationPath .\Help.zip
        Copy-Item -Path .\Help.zip -Destination "${{ GITHUB.WORKSPACE }}\Plain Craft Launcher 2\Resources\Help.zip" -Force
        Set-Location ..
        Remove-Item PCL2Help -Recurse -Force
        Set-Location ${{ GITHUB.WORKSPACE }}


    - name: Replace
      run: |
        (gc "Plain Craft Launcher 2\Modules\ModSecret.vb") -replace 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "")', 'Public CurseForgeAPIKey As String = If(Environment.GetEnvironmentVariable("PCL_CURSEFORGE_API_KEY"), "${{ secrets.CURSEFORGE_API_KEY }}")' | Out-File "Plain Craft Launcher 2\Modules\ModSecret.vb"
        (gc "Plain Craft Launcher 2\Modules\Base\ModBase.vb") -replace 'Public Const CommitHash As String = ""', 'Public Const CommitHash As String = "${{ github.sha }}"' | Out-File "Plain Craft Launcher 2\Modules\Base\ModBase.vb"
        
    - name: Restore NuGet Packages
      run: dotnet restore PCLCS\PCLCS.csproj -p:Configuration=${{ matrix.configuration }}

    - name: Test SDUcraft loader lifecycle
      run: .\tests\Run-SduLoaderBridgeTests.ps1

    - name: Test SDUcraft bare-client installation
      run: .\tests\Run-SduBareClientTests.ps1

    - name: Test nested mouse wheel routing
      run: .\tests\Run-SduScrollTests.ps1

    - name: Test startup network check
      run: .\tests\Run-SduNetworkCheckTests.ps1

    - name: Test skin-site login policy
      run: .\tests\Run-SduSkinLoginTests.ps1

    - name: Test forced instance isolation
      run: .\tests\Run-SduIsolationTests.ps1

    - name: Test launcher update lifecycle
      run: .\tests\Run-SduUpdateTests.ps1

    - name: Test once-only startup notice
      run: .\tests\Run-SduStartupNoticeTests.ps1

    - name: Build
      run: msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=${{ matrix.configuration }}

    - name: Test built update helper
      run: .\tests\Run-SduUpdateIntegrationTests.ps1 -Executable 'Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe'

    - name: Test settings and help layout
      run: .\tests\Run-SduSettingsLayoutTests.ps1 -Executable 'Plain Craft Launcher 2\bin\Plain Craft Launcher 2.exe'

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.configuration }} ${{ env.describe }}
        path: |
          Plain Craft Launcher 2/bin/Plain Craft Launcher 2.exe
          Plain Craft Launcher 2/bin/Plain Craft Launcher 2.exe.config
